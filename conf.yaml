dataset:
  path: ./DCASE2023_dataset/  # path to DCASE ASD dataset
  edition: DCASE2023  # DCASE2020, DCASE2022, DCASE2023, DCASE2024, or DCASE2025
  eval_metrics: official  # official or simple

model:
  mode: direct-act  # direct-act, contrastive, stat-contrastive, STFT-raw, openL3-*, BEATs-*, or EAT-raw
  norm_type: ratio  # none, ratio, difference, or LOF (requires a value for K)
  norm_param: 1  # none, int (for K), or float (for r)
  source_K_means: none  # none (default) or int (for K)
  standardize: false  # apply domain-wise standardization of test scores (Boolean)
  smote: false # apply SMOTE (bool)
  smote_num_neighbors: 4  # number of neighbors used for generating samples with SMOTE (int)
  subspace_dim: 32  # dimension of the learned AdaProj subspaces (int)
  bias: false  # use bias terms (Boolean)
  affine: false  # use (learnable) affine transformations for batch normalizations (Boolean)
  trainable_centers: false  # use trainable centers for the AdaProj loss (Boolean)
  feature_exchange_enabled: true  # upstream direct-act baseline; false disables only its Feature Exchange loss
  n_clusters: 8  # statistical-clustering pseudo-label count; fit from normal training audio only
  temperature: 0.05  # NT-Xent temperature

training:
  n_ensemble: 1  # begin with one run; increase after a safe pilot
  batch_size: 8  # conservative batch size for memory-constrained machines
  num_workers: 0  # avoids worker copies of memory-mapped audio on constrained machines
  accelerator: auto  # Lightning selects CUDA, MPS, or CPU when available
  validate_during_training: false  # keeps held-out anomaly labels out of training/model selection
  seed: 42  # each ensemble run uses seed + run index
  results_dir: ./results/  # timestamped per-run CSV metrics
  num_epochs_direct-act: 5  # number of epochs for the DCASE 2023 laptop baseline pilot
  num_epochs_contrastive: 50  # adjust after a small pilot and fixed compute budget
  num_epochs_stat-contrastive: 50  # adjust after a small pilot and fixed compute budget
  num_epochs_openL3-act: 500  # number of epochs for openL3-act (int)
  num_epochs_BEATs-act: 500  # number of epochs for BEATs-act (int)
  use_checkpoints: true  # saves or loads a previously trained embedding model with the provided parameters (Boolean)
  model_dir: ./models/  # path to model directory

embs:
  openL3_input_dim: 512  # dimension of the openL3 embeddings, should match the model used (int)
  BEATs_input_dim: 6144  # dimension of the BEATs embeddings, should match the model used (int)
  EAT_input_dim: 6912  # dimension of the EAT embeddings, should match the model used (int)
